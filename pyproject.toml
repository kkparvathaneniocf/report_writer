[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lab-report-ollama"
version = "0.1.0"
description = "Traceable laboratory report generation with Ollama"
requires-python = ">=3.11"
dependencies = ["ollama>=0.5", "pydantic>=2.8", "python-docx>=1.1", "pandas>=2.2", "pymupdf>=1.24", "typer>=0.12", "pyyaml>=6.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
lab-report = "lab_report.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_report"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
