[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lab-report-ollama"
version = "0.1.0"
description = "Traceable laboratory report generation with Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.5",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pydantic>=2.8",
    # pymupdf 2.0 currently fails to install (metadata name mismatch: pymupdf-lite).
    "pymupdf>=1.24,<2",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pandas-stubs", "pytest>=8", "ruff>=0.8", "types-PyYAML"]

[project.scripts]
lab-report = "lab_report.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_report"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as call defaults by design.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Noise from PyMuPDF 1.x SWIG bindings on Python 3.12+.
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
